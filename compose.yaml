services:
  dev-postgres:
    image: postgres:18.4-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - todo
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
networks:
  todo: